[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pullback-prediction"
version = "0.1.0"
description = "Leakage-aware probabilistic XAUUSD pullback prediction research system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<25",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
xgboost = [
  "xgboost>=2.0,<4",
]
deep-learning = [
  "torch>=2.2",
]
ml = [
  "xgboost>=2.0,<4",
  "torch>=2.2",
]
api = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
]
dashboard = [
  "streamlit>=1.32,<2",
  "plotly>=5.20,<7",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
  "mypy>=1.9,<2",
]

[project.scripts]
pullback-predict = "pullback_prediction.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["kaggle/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/pullback_prediction/cli.py" = ["B008"]
