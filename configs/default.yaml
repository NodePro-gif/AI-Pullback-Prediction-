project:
  name: ai-pullback-prediction
  instrument: XAUUSD
  timeframes: [M1, M5]
  timezone: UTC

data:
  source: dukascopy
  price_basis: bid_ask
  timestamp_column: timestamp
  train:
    start: "2015-01-01T00:00:00Z"
    end_exclusive: "2021-01-01T00:00:00Z"
  validation:
    start: "2021-01-01T00:00:00Z"
    end_exclusive: "2024-01-01T00:00:00Z"
  test:
    start: "2024-01-01T00:00:00Z"
    end_exclusive: null

features:
  ema_periods: [20, 50, 200]
  rsi_period: 14
  atr_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  return_lags: [1, 2, 3, 5, 10, 20]
  rolling_volatility_windows: [5, 15, 30, 60]

labels:
  horizon_bars: 12
  barrier_atr_multiple: 1.5
  neutral_band_atr_multiple: 0.25

decision:
  classes: [SELL, WAIT, BUY]
  minimum_probability: 0.60
  minimum_expected_value_r: 0.10
  live_execution_enabled: false

risk:
  risk_per_trade: 0.005
  stop_loss_atr_multiple: 1.5
  take_profit_atr_multiple: 2.0
  include_spread: true
  include_slippage: true
